[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
name = "furigana4epub_core"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
dirs = "6.0.0"
percent-encoding = "2.3.2"
roxmltree = "0.21.2"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", tag = "v0.7.0", version = "0.7.0" }
tempfile = "3.27.0"
unicode-script = "0.5.9"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sha2 = "0.11.1"
