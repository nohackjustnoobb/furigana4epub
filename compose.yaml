services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      API_MAX_CONCURRENT_JOBS: "${API_MAX_CONCURRENT_JOBS:-2}"
      API_MAX_INPUT_BYTES: "${API_MAX_INPUT_BYTES:-104857600}"
      API_MAX_WORDLIST_BYTES: "${API_MAX_WORDLIST_BYTES:-1048576}"
      API_MAX_STORAGE_BYTES: "${API_MAX_STORAGE_BYTES:-2147483648}"
      API_UPLOAD_TTL_SECONDS: "${API_UPLOAD_TTL_SECONDS:-1800}"
      API_FINISHED_TTL_SECONDS: "${API_FINISHED_TTL_SECONDS:-86400}"
      API_CLEANUP_INTERVAL_SECONDS: "${API_CLEANUP_INTERVAL_SECONDS:-60}"
